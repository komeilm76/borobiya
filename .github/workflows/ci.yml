name: Borobiya quality gate

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      # Vitest imports Bun-only modules (bun:sqlite, Bun.password, Bun.serve), so the test
      # runner must execute under Bun instead of Node.
      BUN_INSTALL: /home/runner/.bun
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      # The Bun release objects on GitHub's CDN intermittently answer 504, which fails the whole
      # gate before any project step runs. Install the same pinned version from the npm registry
      # (the `@oven/bun-linux-x64` tarball for 1.4.4) instead, with a bounded retry. The version
      # comes from `.bun-version`, so the pin is unchanged and there is no floating download.
      - name: Install the pinned Bun runtime from the npm registry
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < .bun-version)"
          for attempt in 1 2 3 4 5; do
            echo "Attempt $attempt of 5 for Bun $version"
            if curl --fail --silent --show-error --location --retry 3 --retry-delay 2 \
                --max-time 300 \
                -o /tmp/bun-linux-x64.tgz \
                "https://registry.npmjs.org/@oven/bun-linux-x64/-/bun-linux-x64-${version}.tgz" \
              && mkdir -p "$HOME/.bun/bin" \
              && tar -xzf /tmp/bun-linux-x64.tgz -C /tmp \
              && install -m 755 /tmp/package/bin/bun "$HOME/.bun/bin/bun" \
              && ln -sf "$HOME/.bun/bin/bun" "$HOME/.bun/bin/bunx" \
              && echo "$HOME/.bun/bin" >> "$GITHUB_PATH"; then
              "$HOME/.bun/bin/bun" --version
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "::error::Could not install Bun $version from the npm registry after 5 attempts"
          exit 1
      - name: Verify the pinned Bun runtime
        run: bun --version
      - name: Install dependencies from the frozen lockfile
        run: bun install --frozen-lockfile
      - name: Generate deterministic browser assets
        run: bun run assets
      - name: Typecheck the Bun server
        run: bun run typecheck:server
      - name: Typecheck the Vue client
        run: bun run typecheck:client
      - name: Documentation and clean-rebuild guards
        run: bun run docs:check
      - name: Build the Vue bundle and the service worker
        run: bun run build
      - name: Vitest suite with coverage
        run: bun run coverage
      - name: Release benchmark
        run: bun run bench
      - name: In-process runtime smoke
        run: bun run smoke
      - name: Release acceptance evidence
        run: bun run acceptance
      - name: Validate production configuration
        env:
          NODE_ENV: production
          COOKIE_SECURE: '1'
          TRUST_PROXY: '1'
          SEED_DEMO_USERS: '0'
          ADMIN_PASSWORD: CIGeneratedPass!2026-A
          ALLOWED_ORIGINS: https://borobiya.example.test
          FRAME_ANCESTORS: https://borobiya.example.test
        run: bun run deploy:check
