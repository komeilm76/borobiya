name: Borobiya quality gate

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      # Vitest imports Bun-only modules (bun:sqlite, Bun.password, Bun.serve), so the test
      # runner must execute under Bun instead of Node.
      BUN_INSTALL: /home/runner/.bun
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Verify the pinned Bun runtime
        run: bun --version
      - name: Install dependencies from the frozen lockfile
        run: bun install --frozen-lockfile
      - name: Generate deterministic browser assets
        run: bun run assets
      - name: Typecheck the Bun server
        run: bun run typecheck:server
      - name: Typecheck the Vue client
        run: bun run typecheck:client
      - name: Documentation and clean-rebuild guards
        run: bun run docs:check
      - name: Build the Vue bundle and the service worker
        run: bun run build
      - name: Vitest suite with coverage
        run: bun run coverage
      - name: Release benchmark
        run: bun run bench
      - name: In-process runtime smoke
        run: bun run smoke
      - name: Release acceptance evidence
        run: bun run acceptance
      - name: Validate production configuration
        env:
          NODE_ENV: production
          COOKIE_SECURE: '1'
          TRUST_PROXY: '1'
          SEED_DEMO_USERS: '0'
          ADMIN_PASSWORD: CIGeneratedPass!2026-A
          ALLOWED_ORIGINS: https://borobiya.example.test
          FRAME_ANCESTORS: https://borobiya.example.test
        run: bun run deploy:check
