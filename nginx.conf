server {
    listen 80;
    server_name _;

    # Resolve upstream container names through Docker's embedded DNS with a
    # short TTL (via the variables below) so a recreated api/map-server/
    # routing-gateway container is re-resolved to its new IP instead of
    # returning 502s against the address cached at nginx startup.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    set $upstream_api "api:3000";
    set $upstream_gateway "routing-gateway:3000";
    set $upstream_martin "map-server:3000";

    # Inherited by every location below (none override proxy_set_header).
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = / {
        default_type text/plain;
        return 200 "Borobiya API/map gateway. Start the client with bun run dev.\n";
    }

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The browser uses /api as a same-origin prefix; Fastify routes do not include it.
    location = /api {
        return 308 /api/;
    }

    location ^~ /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$upstream_api;
    }

    location = /docs {
        proxy_pass http://$upstream_api$request_uri;
    }

    location ^~ /docs/ {
        proxy_pass http://$upstream_api$request_uri;
    }

    # Public, non-secret deployment settings for the map client.
    location = /map-config {
        rewrite ^ /config break;
        proxy_pass http://$upstream_gateway;
    }

    # The route adapter translates the project POST /route contract to OSRM's
    # per-profile POST /route/v1/{profile} API.
    location = /route {
        proxy_pass http://$upstream_gateway$request_uri;
    }

    # The local gateway forwards these paths to the optional offline Photon service.
    location = /geocode {
        proxy_pass http://$upstream_gateway$request_uri;
    }

    location = /reverse {
        proxy_pass http://$upstream_gateway$request_uri;
    }

    # Strip /map so Martin receives its own source/catalog paths.
    location = /map {
        return 308 /map/;
    }

    location ^~ /map/ {
        rewrite ^/map/(.*)$ /$1 break;
        proxy_pass http://$upstream_martin;
    }

    # Martin style JSON uses root-relative asset URLs. Keep tiles, sprite sheets,
    # and glyph ranges same-origin while forwarding them to the independent server.
    location ~ ^/(borobiya|sprite|font)/ {
        proxy_pass http://$upstream_martin$request_uri;
    }

    location / {
        return 404;
    }
}
