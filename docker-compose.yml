services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-borobiya}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-borobiya}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-borobiya}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-borobiya}
      OPENAPI_SERVER_PATH: ${OPENAPI_SERVER_PATH:-/api}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000,http://localhost:8080}
      MAP_SERVER_URL: http://map-server:3000
      MAP_STYLE_LIGHT: http://map-server:3000/style/light
      MAP_STYLE_DARK: http://map-server:3000/style/dark
      MAP_ROUTING_URL: http://routing-gateway:3000/route
      MAP_GEOCODE_URL: http://routing-gateway:3000/geocode
      MAP_REVERSE_URL: http://routing-gateway:3000/reverse
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3000/_public/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  map-server:
    image: ghcr.io/maplibre/martin:1.16.1
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-borobiya}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-borobiya}
    command: ["--config", "/martin.yaml"]
    volumes:
      - ./map-server/martin.yaml:/martin.yaml:ro
      - ./map-server/data:/data:ro
      - ./map-server/styles:/styles:ro
      - ./map-server/sprites:/sprites:ro
      - ./map-server/fonts:/fonts:ro
    ports:
      - "127.0.0.1:${MAP_SERVER_PORT:-8000}:3000"
    depends_on:
      postgres:
        condition: service_healthy

  nominatim:
    image: mediagis/nominatim:5.3-2026-06-23T09-03
    restart: unless-stopped
    environment:
      PBF_PATH: /nominatim/data/${MAP_REGION:-tehran}.osm.pbf
      NOMINATIM_PASSWORD: ${NOMINATIM_PASSWORD:-change-me}
      IMPORT_STYLE: ${NOMINATIM_IMPORT_STYLE:-full}
      IMPORT_WIKIPEDIA: "false"
      THREADS: ${NOMINATIM_THREADS:-4}
    volumes:
      - ./map-server/data:/nominatim/data:ro
      - nominatim-data:/var/lib/postgresql/16/main
    ports:
      - "127.0.0.1:${NOMINATIM_HTTP_PORT:-8081}:8080"
      - "127.0.0.1:${NOMINATIM_DB_PORT:-5433}:5432"
    shm_size: ${NOMINATIM_SHM_SIZE:-2g}
    profiles: ["geocoding-import"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://127.0.0.1:8080/status?format=json' >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30m

  photon:
    build:
      context: ./map-server/photon
    image: borobiya/photon:1.3.0
    restart: unless-stopped
    command: ["serve", "-listen-ip", "0.0.0.0", "-listen-port", "2322", "-default-language", "fa"]
    volumes:
      - ./map-server/photon/data:/var/lib/photon
    ports:
      - "127.0.0.1:${PHOTON_PORT:-2322}:2322"
    profiles: ["geocoding"]

  osrm-car:
    image: ghcr.io/project-osrm/osrm-backend:v26.10.0
    restart: unless-stopped
    command: ["osrm-routed", "--algorithm", "mld", "/data/${MAP_REGION:-tehran}.osrm"]
    volumes:
      - ${MAP_OSRM_DATA_DIR:-./map-server/osrm/data}/car:/data:ro
    profiles: ["routing"]

  osrm-bicycle:
    image: ghcr.io/project-osrm/osrm-backend:v26.10.0
    restart: unless-stopped
    command: ["osrm-routed", "--algorithm", "mld", "/data/${MAP_REGION:-tehran}.osrm"]
    volumes:
      - ${MAP_OSRM_DATA_DIR:-./map-server/osrm/data}/bicycle:/data:ro
    profiles: ["routing"]

  osrm-foot:
    image: ghcr.io/project-osrm/osrm-backend:v26.10.0
    restart: unless-stopped
    command: ["osrm-routed", "--algorithm", "mld", "/data/${MAP_REGION:-tehran}.osrm"]
    volumes:
      - ${MAP_OSRM_DATA_DIR:-./map-server/osrm/data}/foot:/data:ro
    profiles: ["routing"]

  routing-gateway:
    build:
      context: ./map-server/routing-gateway
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      MAP_REGION: ${MAP_REGION:-tehran}
      MAP_BBOX: ${MAP_BBOX:-51.0,35.5,51.7,35.9}
      MAP_DATA_VERSION: ${MAP_DATA_VERSION:-2026-10-18}
      MAP_MIN_ZOOM: ${MAP_MIN_ZOOM:-0}
      MAP_MAX_ZOOM: ${MAP_MAX_ZOOM:-14}
      OSRM_CAR_URL: http://osrm-car:5000/route/v1/car
      OSRM_BICYCLE_URL: http://osrm-bicycle:5000/route/v1/bike
      OSRM_FOOT_URL: http://osrm-foot:5000/route/v1/foot
      PHOTON_GEOCODE_URL: http://photon:2322/api
      PHOTON_REVERSE_URL: http://photon:2322/reverse
    ports:
      - "127.0.0.1:${MAP_ROUTING_PORT:-8001}:3000"
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3000/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${NGINX_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      map-server:
        condition: service_started
      routing-gateway:
        condition: service_healthy

volumes:
  postgres-data: {}
  nominatim-data: {}
