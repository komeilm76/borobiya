# Martin 1.16.1 resource configuration. Paths are container paths from docker-compose.yml.
# Deliberately NO postgres connection: Martin serves only the PMTiles archive,
# styles, sprites, and fonts below. The old connection_string contributed zero
# tile sources (no tables/functions were published) but made Martin exit on any
# application-database credential mismatch, and its default auto-publish could
# expose private spatial data such as users.last_location. If a reviewed public
# Postgres tile source is ever added, configure it explicitly with
# `auto_publish: false` and named tables/functions only.

pmtiles:
  paths:
    - /data

styles:
  paths:
    - /styles

sprites:
  paths:
    - /sprites/borobiya

fonts:
  paths:
    - /fonts
  aliases:
    Borobiya Sans:
      - Noto Sans Regular
      - Noto Naskh Arabic Regular
