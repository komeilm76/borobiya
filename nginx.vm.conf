# VM static-client variant of nginx.conf; keep API/map/socket locations identical.
# An external TLS terminator must overwrite X-Forwarded-Proto to https. Accept only that
# exact value from the loopback-only upstream; otherwise report the actual local scheme.
map $http_x_forwarded_proto $borobiya_client_scheme {
    default $scheme;
    https https;
}
server {
    listen 80;
    server_name _;

    # Resolve upstream container names through Docker's embedded DNS with a
    # short TTL (via the variables below) so a recreated api/map-server/
    # routing-gateway container is re-resolved to its new IP instead of
    # returning 502s against the address cached at nginx startup.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    set $upstream_api "api:3000";
    set $upstream_gateway "routing-gateway:3000";
    set $upstream_martin "map-server:3000";

    # Inherited by every location below (none override proxy_set_header).
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $borobiya_client_scheme;

    # VM quickstart: serve the built SPA from the same origin as API, map and sockets.
    root /usr/share/nginx/html;
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The browser uses /api as a same-origin prefix; Fastify routes do not include it.
    location = /api {
        return 308 /api/;
    }

    # Signed photo URLs are bearer capabilities; never record their query strings in access logs.
    # This is an API proxy, NOT a static mount of the private upload volume.
    location ^~ /api/uploads/ {
        access_log off;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$upstream_api;
    }

    # Authenticated timeline SSE stays unbuffered while ordinary API responses remain buffered.
    # No bearer appears in the URL; the inherited proxy headers forward only request headers.
    location ^~ /api/_user/sos/missions/ {
        proxy_buffering off;
        proxy_read_timeout 60s;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$upstream_api;
    }

    location ^~ /api/ {
        # Allow multipart SOS photo uploads (contract default 5 MB + multipart framing)
        # through to Fastify instead of rejecting >1 MB smartphone photos at nginx.
        client_max_body_size 10m;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$upstream_api;
    }

    # Socket.IO (live location broadcasts, later SOS alerts) upgrades to a WebSocket when the
    # browser can and long-polls otherwise. proxy_set_header values are NOT inherited into a
    # location that declares any of its own, so the base headers are repeated here. Connection
    # forwards the client value verbatim because this file is a server block and cannot declare
    # the usual `map $http_upgrade $connection_upgrade`; non-upgrade requests keep keep-alive.
    location = /api/socket.io {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $borobiya_client_scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        rewrite ^/api(.*)$ $1 break;
        proxy_pass http://$upstream_api;
    }

    location ^~ /api/socket.io/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $borobiya_client_scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        # Must exceed pingInterval (25s) + pingTimeout (10s) or idle sockets are cut.
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$upstream_api;
    }

    location = /docs {
        proxy_pass http://$upstream_api$request_uri;
    }

    location ^~ /docs/ {
        proxy_pass http://$upstream_api$request_uri;
    }

    # Public, non-secret deployment settings for the map client.
    location = /map-config {
        rewrite ^ /config break;
        proxy_pass http://$upstream_gateway;
    }

    # The route adapter translates the project POST /route contract to OSRM's
    # per-profile POST /route/v1/{profile} API.
    location = /route {
        proxy_pass http://$upstream_gateway$request_uri;
    }

    # The local gateway forwards these paths to the optional offline Photon service.
    location = /geocode {
        proxy_pass http://$upstream_gateway$request_uri;
    }

    location = /reverse {
        proxy_pass http://$upstream_gateway$request_uri;
    }

    # Strip /map so Martin receives its own source/catalog paths.
    location = /map {
        return 308 /map/;
    }

    location ^~ /map/ {
        rewrite ^/map/(.*)$ /$1 break;
        proxy_pass http://$upstream_martin;
    }

    # Martin style JSON uses root-relative asset URLs. Keep tiles, sprite sheets,
    # and glyph ranges same-origin while forwarding them to the independent server.
    location ~ ^/(borobiya|sprite|font)/ {
        proxy_pass http://$upstream_martin$request_uri;
    }

}
